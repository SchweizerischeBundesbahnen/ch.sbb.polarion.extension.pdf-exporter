<!-- Document Properties side panel. Polarion (PdfExporterFormExtension) injects this fragment into the
  document editor's Document Properties pane. On load the React side-panel bundle is imported and mounts
  into a SHADOW ROOT on the div below (see ui/src/sidepanel/mount.tsx). It injects its own styles into that
  shadow root - react-sbb-polarion's bundled stylesheet plus side-panel.css - so the panel's CSS is fully
  encapsulated and cannot clash with other extensions' panels on this shared page. The generic control CSS
  is intentionally NOT linked globally here any more (it lives in the shadow).

  If we put javascript code just in an inline 'script' block it won't be initialized, but the attribute
  'onload' below allows to import our module. The one remaining <link> loads a tiny empty stylesheet
  (starter.css) that only fires that trigger. {BUNDLE_VERSION} busts the browser cache of the bundle when
  the extension is updated, the URL being fixed. -->
<link href='/polarion/pdf-exporter/ui/css/starter.css' rel='stylesheet'
      onload='import("/polarion/pdf-exporter-app/ui/app/assets/side-panel.js?v={BUNDLE_VERSION}")
                .then(module => module.mountSidePanel("#pdf-exporter-panel"))
                .catch(console.error);'>

<div id="pdf-exporter-panel" class="pdf-exporter form-wrapper"></div>
