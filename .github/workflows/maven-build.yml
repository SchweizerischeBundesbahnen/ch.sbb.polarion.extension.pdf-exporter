---
name: Build & Release
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, release-v*]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
env:
  SETTINGS_XML: ${{ github.workspace }}/.mvn/settings.xml
  JAVA_VERSION: 21
  JAVA_DISTRIBUTION: temurin
  SONAR_SCANNER_OPTS: -Xmx1024m
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      weasyprint:
        image: ghcr.io/schweizerischebundesbahnen/weasyprint-service:latest@sha256:a803eed6b2cd5609c992423d45dce04ebe0e42f64c6e97c7f632c518e00553d0  # zizmor: ignore[unpinned-images]
        ports: [9080:9080]
    outputs:
      project_version: ${{ steps.project_metadata.outputs.version }}
      is_release: ${{ steps.project_metadata.outputs.is_release }}
    env:
      IO_JFROG_SBB_POLARION_TOKEN: ${{ secrets.IO_JFROG_SBB_POLARION_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}  # Providing this prevents reaching the GitHub request limits
      WEASYPRINT_SERVICE_URL: http://localhost:9080
    steps:
      - name: 📄 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0  # Sonar needs full history
          persist-credentials: false
      - name: 🧱 Set up JDK and Maven
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: 🔎 Check that the service draws SVG with weasysvg
        # weasysvg is the default renderer of the service, and the shared reference images are what it draws
        run: |
          curl --fail --silent --show-error "${WEASYPRINT_SERVICE_URL}/version" | tee /dev/stderr \
            | jq --exit-status '.svgRenderer == "weasysvg"'
      - name: 📝 Extract project metadata
        id: project_metadata
        run: |
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          # Check if it is a release
          if [[ ! "${VERSION}" =~ -SNAPSHOT$ ]]; then
            IS_RELEASE=true
          else
            IS_RELEASE=false
          fi
          {
            echo "version=${VERSION}"
            echo "is_release=${IS_RELEASE}"
          } >> "$GITHUB_OUTPUT"
      - name: 🔍 Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: 📦 Build with Maven for Pushes
        if: github.event_name == 'push'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
          IS_PUBLIC: ${{ github.event.repository.visibility == 'public' }}
          IS_TEMPLATE: ${{ github.event.repository.is_template }}
        run: |
          SONAR_ARGS=()
          if [ "${IS_PUBLIC}" = "true" ] && [ "${IS_TEMPLATE}" != "true" ]; then
            SONAR_ARGS+=(sonar:sonar "-Dsonar.exclusions=.github/**")
            if [ -n "${BRANCH_NAME}" ]; then
              SONAR_ARGS+=("-Dsonar.branch.name=${BRANCH_NAME}")
            fi
          fi
          mvn --batch-mode -s "${SETTINGS_XML}" clean verify -P tests-with-weasyprint-docker -Dweasyprint.service.url="${WEASYPRINT_SERVICE_URL}" "${SONAR_ARGS[@]}"
      - name: 📦 Build with Maven for PRs
        if: github.event_name == 'pull_request'
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_PR_NUMBER_REF: ${{ github.event.pull_request.number }}
          IS_PUBLIC: ${{ github.event.repository.visibility == 'public' }}
          IS_TEMPLATE: ${{ github.event.repository.is_template }}
        run: |
          SONAR_ARGS=()
          if [ "${IS_PUBLIC}" = "true" ] && [ "${IS_TEMPLATE}" != "true" ]; then
            SONAR_ARGS+=(sonar:sonar "-Dsonar.pullrequest.base=${GITHUB_BASE_REF}" "-Dsonar.pullrequest.branch=${GITHUB_HEAD_REF}" "-Dsonar.pullrequest.key=${GITHUB_PR_NUMBER_REF}" "-Dsonar.exclusions=.github/**")
          fi
          mvn --batch-mode -s "${SETTINGS_XML}" clean verify -P tests-with-weasyprint-docker -Dweasyprint.service.url="${WEASYPRINT_SERVICE_URL}" "${SONAR_ARGS[@]}"
      - name: 📋 Analyze dependencies
        run: mvn --batch-mode -s "${SETTINGS_XML}" dependency:analyze
        continue-on-error: false
      - name: 📦 Upload build artifacts
        # needed for uploads to GitHub Releases
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: maven-artifacts
          path: |
            target/*.jar
            target/*.pom
          retention-days: 1
          if-no-files-found: error
  # The WeasyPrint tests once more, with the service drawing SVG through Chromium,
  # its fallback renderer (SVG_RENDERER=chromium). A page it draws differently
  # compares with its own reference image in src/test/resources/weasyprint/png/chromium.
  build-chromium:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      weasyprint:
        image: ghcr.io/schweizerischebundesbahnen/weasyprint-service:latest@sha256:a803eed6b2cd5609c992423d45dce04ebe0e42f64c6e97c7f632c518e00553d0  # zizmor: ignore[unpinned-images]
        ports: [9080:9080]
        env:
          SVG_RENDERER: chromium
    env:
      IO_JFROG_SBB_POLARION_TOKEN: ${{ secrets.IO_JFROG_SBB_POLARION_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}  # Providing this prevents reaching the GitHub request limits
      WEASYPRINT_SERVICE_URL: http://localhost:9080
    steps:
      - name: 📄 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 🧱 Set up JDK and Maven
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: 🔎 Check that the service draws SVG with Chromium
        # A service which ignored SVG_RENDERER would draw with weasysvg, and every page would compare with the shared images
        run: |
          curl --fail --silent --show-error "${WEASYPRINT_SERVICE_URL}/version" | tee /dev/stderr \
            | jq --exit-status '.svgRenderer == "chromium"'
      - name: 🧪 Test with Chromium
        run: mvn --batch-mode -s "${SETTINGS_XML}" clean verify -P tests-with-weasyprint-docker -Dweasyprint.service.url="${WEASYPRINT_SERVICE_URL}"
  # Deploy releases to Maven Central from main and LTS branches (release-v*)
  # See RELEASE.md for LTS branch documentation
  deploy-maven-central:
    needs: build
    if: ${{ needs.build.outputs.is_release == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      COM_SONATYPE_CENTRAL_POLARION_OPENSOURCE_USERNAME: ${{ secrets.COM_SONATYPE_CENTRAL_POLARION_OPENSOURCE_USERNAME }}
      COM_SONATYPE_CENTRAL_POLARION_OPENSOURCE_TOKEN: ${{ secrets.COM_SONATYPE_CENTRAL_POLARION_OPENSOURCE_TOKEN }}
      COM_SONATYPE_CENTRAL_POLARION_OPENSOURCE_GPG_PASSPHRASE: ${{ secrets.COM_SONATYPE_CENTRAL_POLARION_OPENSOURCE_GPG_PASSPHRASE }}
      # The deploy rebuilds the project, and the Maven cache does not always spare it the Polarion artifacts of JFrog
      IO_JFROG_SBB_POLARION_TOKEN: ${{ secrets.IO_JFROG_SBB_POLARION_TOKEN }}
      GITHUB_TOKEN: ${{ github.token }}  # Providing this prevents reaching the GitHub request limits
    steps:
      - name: 📄 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 🧱 Set up JDK and Maven with cache
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
          gpg-private-key: ${{ secrets.COM_SONATYPE_CENTRAL_POLARION_OPENSOURCE_GPG_PRIVATE_KEY }}
      - name: 📦 Deploy to Maven Central
        # This cannot be implemented using deploy:deploy-file
        # The central-publishing-maven-plugin must be used instead due to specific deployment requirements
        # Additionally, timeouts are set to 1 hour to avoid issues with the connection to Sonatype Central during deployment
        run: |
          mvn --version
          mvn --batch-mode -s "${SETTINGS_XML}" clean deploy \
            -Dmaven.test.skip=true \
            -DskipJsTests=true \
            -P gpg-sign \
            -P central-publishing \
            -Dcentral.timeout=3600 \
            -Dmaven.wagon.http.connectionTimeout=3600000 \
            -Dmaven.wagon.http.readTimeout=3600000 \
            -Dcentral-publishing-maven-plugin.autoPublish=${{ github.event.repository.visibility == 'public' }}
  # Publish to JFrog Artifactory (sbb.jfrog.io/artifactory/polarion-mvn).
  # SNAPSHOTs from main always; releases only when the repo is private (public
  # releases go to Maven Central, see deploy-maven-central). Reuses the artifact
  # built by the build job via deploy:deploy-file (no rebuild).
  deploy-jfrog-io:
    needs: build
    if: ${{ github.ref == 'refs/heads/main' || (needs.build.outputs.is_release == 'true' && startsWith(github.ref, 'refs/heads/release-v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IO_JFROG_SBB_POLARION_TOKEN: ${{ secrets.IO_JFROG_SBB_POLARION_TOKEN }}
      PROJECT_VERSION: ${{ needs.build.outputs.project_version }}
    steps:
      - name: 📄 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 📥 Download build artifacts
        # The artifacts are generated in the 'build' job
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: maven-artifacts
          path: target/
      - name: 🧱 Set up JDK and Maven
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: maven
      - name: 📦 Deploy to JFrog Artifactory
        # SNAPSHOTs always; releases only when the repo is private (public releases
        # go to Maven Central). Main JAR + POM only — sources/javadoc are produced
        # only for Maven Central releases.
        if: ${{ needs.build.outputs.is_release == 'false' || github.event.repository.visibility == 'private' }}
        run: |
          jar=(target/*-"${PROJECT_VERSION}".jar)
          mvn --batch-mode -s "${SETTINGS_XML}" deploy:deploy-file \
            -DrepositoryId=jfrog_io \
            -Durl=https://sbb.jfrog.io/artifactory/polarion-mvn \
            -DpomFile=pom.xml \
            -Dfile="${jar[0]}"
  # Attach the built JAR to the GitHub Release page. Releases are published to Maven
  # Central (public repos) or JFrog Artifactory (private repos); SNAPSHOTs go to JFrog.
  upload-release-assets:
    needs: build
    if: ${{ needs.build.outputs.is_release == 'true' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release-v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PROJECT_VERSION: ${{ needs.build.outputs.project_version }}
    steps:
      - name: 📄 Checkout the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: 📥 Download build artifacts
        # The artifacts are generated in the 'build' step
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: maven-artifacts
          path: target/
      - name: 📦 Upload assets to GitHub Release
        run: |-
          gh release upload "v${PROJECT_VERSION}" "target/*-${PROJECT_VERSION}.jar" --clobber
